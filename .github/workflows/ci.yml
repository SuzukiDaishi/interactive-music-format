name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install
        run: npm install

      - name: Build engine
        run: npm run build:engine

      - name: Test (pack + engine + player e2e)
        run: npm test

      - name: Build demo module
        run: node examples/make-demo.mjs

      - name: Build DAW
        run: npm run build:daw
